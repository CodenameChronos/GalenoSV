services:
  postgres:
    image: postgres:14.24-alpine3.23
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: kardia
      POSTGRES_PASSWORD: arb1705ivff
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kardia -d appdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: pr23045@ues.edu.sv
      PGADMIN_DEFAULT_PASSWORD: 447375
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres

volumes:
  postgres_data:
  pgadmin_data:
