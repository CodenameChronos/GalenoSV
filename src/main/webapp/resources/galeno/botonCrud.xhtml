<?xml version="1.0" encoding="UTF-8"?>
<ui:composition
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:cc="jakarta.faces.composite"
      xmlns:p="primefaces"
      xmlns:ui="jakarta.faces.facelets">

    <cc:interface>

        <cc:attribute name="value"
                      type="java.lang.String"
                      required="true" />

        <cc:attribute name="rendered"
                      type="java.lang.Boolean"
                      default="true" />

        <cc:attribute name="styleClass"
                      type="java.lang.String"
                      required="false" />

        <cc:attribute name="action"
                      method-signature="java.lang.Object action()"
                      required="false" />

        <cc:attribute name="actionListener"
                      method-signature="void actionListener(jakarta.faces.event.ActionEvent)"
                      required="false" />

        <cc:attribute name="update"
                      type="java.lang.String"
                      required="false" />

        <cc:attribute name="process"
                      type="java.lang.String"
                      required="false" />

    </cc:interface>s

    <cc:implementation>

        <p:commandButton
            value="#{cc.attrs.value}"
            action="#{cc.attrs.action}"
            actionListener="#{cc.attrs.actionListener}"
            rendered="#{cc.attrs.rendered}"
            styleClass="#{cc.attrs.styleClass}"
            update="#{cc.attrs.update}"
            process="#{cc.attrs.process}" />

    </cc:implementation>

</ui:composition>
