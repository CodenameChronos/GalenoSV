<?xml version="1.0" encoding="UTF-8"?>

<ui:composition 
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:cc="jakarta.faces.composite"
      xmlns:f="jakarta.faces.core"
      xmlns:h="jakarta.faces.html"
      xmlns:p="primefaces"
      xmlns:ui="jakarta.faces.facelets">

    <cc:interface>
        <cc:facet name="workspace"/>
    </cc:interface>

    <cc:implementation>

        <h:outputStylesheet library="estilos" name="layout-styles.css"/>

        <div class="galeno-page">

            <!-- Header -->
            <div class="galeno-header">

                <div class="galeno-header-row">

                    <div class="galeno-brand">
                        <p:graphicImage
                            library="img"
                            name="galeno-17-09-2026.svg"/>
                    </div>

                    <h1 class="galeno-title">
                        <h:outputText value="Galeno-SV"/>
                    </h1>

                    <!-- Selector de idioma (i18n) -->
                    <div class="galeno-lang">

                        <h:form id="frmIdioma">

                            <p:outputLabel
                                for="idioma"
                                value="#{msg['idioma.selector.etiqueta']}"/>

                            <p:selectOneMenu
                                id="idioma"
                                value="#{localeBean.idioma}">

                                <f:selectItem
                                    itemValue="es"
                                    itemLabel="#{msg['idioma.es']}"/>

                                <f:selectItem
                                    itemValue="en"
                                    itemLabel="#{msg['idioma.en']}"/>

                                <p:ajax
                                    process="@this"
                                    update="@all"/>

                            </p:selectOneMenu>

                        </h:form>

                    </div>

                </div>

            </div>

            <!-- Contenido: sidebar + area de trabajo -->
            <div class="galeno-shell">

                <!-- Navegación -->
                <div class="galeno-nav">

                    <p:menu>
                            <p:menuitem value="#{msg['tipoExamen.titulo']}"
                                        url="#{request.contextPath}/paginas/TipoExamen.jsf"/>
                            <p:menuitem value="#{msg['procedimiento.titulo']}"
                                        url="#{request.contextPath}/paginas/Procedimiento.jsf"/>
                            <p:menuitem value="#{msg['examen.titulo']}"
                                        url="#{request.contextPath}/paginas/Examen.jsf"/>
                            <p:menuitem value="#{msg['rol.titulo']}"
                                        url="#{request.contextPath}/paginas/Rol.jsf"/>
                            <p:menuitem value="#{msg['tipoDocumento.titulo']}"
                                        url="#{request.contextPath}/paginas/TipoDocumento.jsf"/>
                            <p:menuitem value="#{msg['examenTipoExamen.titulo']}"
                                        url="#{request.contextPath}/paginas/ExamenTipoExamen.jsf"/>
                        </p:menu>

                </div>

                <!-- Workspace -->
                <div class="galeno-workspace">
                    <cc:renderFacet name="workspace"/>
                </div>

            </div>

            <!-- Footer -->
            <div class="galeno-footer">

                <h:outputText
                    value="#{msg['footer.derechos']}"/>

            </div>

        </div>

    </cc:implementation>

</ui:composition>
