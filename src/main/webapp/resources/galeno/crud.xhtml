<?xml version="1.0" encoding="UTF-8"?>

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:cc="jakarta.faces.composite"
      xmlns:h="jakarta.faces.html"
      xmlns:p="primefaces"
      xmlns:g="jakarta.faces.composite/galeno">

    <cc:interface>

        <cc:attribute
            name="modelo"
            required="true"
            shortDescription="Bean CDI que hereda de ModelHandler y maneja el CRUD de la entidad."/>

        <cc:attribute
            name="rowKey"
            required="true"
            shortDescription="Expresion EL con la clave unica de la fila, usando la variable r (ej. r.idTipoExamen)."/>

        <cc:attribute
            name="titulo"
            required="true"
            shortDescription="Titulo (h1) que se muestra sobre la tabla."/>

        <cc:attribute
            name="filas"
            type="java.lang.Integer"
            default="10"
            shortDescription="Filas por pagina del paginador. Por defecto 10."/>

        <cc:attribute
            name="mostrarBotones"
            type="java.lang.Boolean"
            default="true"
            shortDescription="Si es false se ocultan Guardar, Eliminar y Cancelar (para pantallas cuya pestana activa trae sus propios botones). Por defecto true."/>

        <cc:facet
            name="formulario"
            required="true"
            shortDescription="Campos de edicion. Se muestra solo en estado CREAR o MODIFICAR."/>

    </cc:interface>

    <cc:implementation>

        <h1>
            <h:outputText value="#{cc.attrs.titulo}"/>
        </h1>

        <!-- Listado: visible en NINGUNO y MODIFICAR -->
        <h:panelGroup id="pnlData" layout="block">

            <g:botonCrud
                value="#{msg['boton.nuevo']}"
                rendered="#{cc.attrs.modelo.estado=='NINGUNO'}"
                styleClass="ui-button-raised ui-button-flat"
                action="#{cc.attrs.modelo.nuevo}"
                process="@this"
                update="pnlCrear pnlData"/>

            <p:dataTable
                value="#{cc.attrs.modelo.lazyModel}"
                var="r"
                lazy="true"
                selectionMode="single"
                selection="#{cc.attrs.modelo.registroActual}"
                cellNavigation="true"
                paginator="true"
                rows="#{cc.attrs.filas}"
                rowKey="#{cc.attrs.rowKey}"
                rendered="#{cc.attrs.modelo.estado=='NINGUNO' or cc.attrs.modelo.estado=='MODIFICAR'}">

                <p:ajax
                    event="rowSelect"
                    listener="#{cc.attrs.modelo.seleccionar}"
                    process="@this"
                    update="pnlCrear pnlData"/>

                <cc:insertChildren/>

            </p:dataTable>

        </h:panelGroup>

        <h:panelGroup id="pnlCrear" layout="block">

            <h:panelGroup
                layout="block"
                rendered="#{cc.attrs.modelo.estado=='CREAR' or cc.attrs.modelo.estado=='MODIFICAR'}">

                <cc:renderFacet name="formulario" required="true"/>

                <h:panelGroup id="botonesCrud" layout="block">

                    <h:panelGroup layout="block" rendered="#{cc.attrs.mostrarBotones}">

                        <g:botonCrud
                            value="#{msg['boton.guardar']}"
                            styleClass="ui-button-raised ui-button-flat"
                            actionListener="#{cc.attrs.modelo.guardarHandler}"
                            update="pnlCrear pnlData :layout:messages"/>

                        <g:botonCrud
                                value="#{msg['boton.eliminar']}"
                                rendered="#{cc.attrs.modelo.estado=='MODIFICAR'}"
                                styleClass="ui-button-raised ui-button-danger"
                                actionListener="#{cc.attrs.modelo.eliminarHandler}"
                                process="@this"
                                update="pnlCrear pnlData :layout:messages"/>

                        <g:botonCrud
                            value="#{msg['boton.cancelar']}"
                            styleClass="ui-button-raised ui-button-secondary ui-button-flat"
                            actionListener="#{cc.attrs.modelo.cancelarHandler}"
                            process="@this"
                            update="pnlCrear pnlData"/>

                    </h:panelGroup>

                </h:panelGroup>

            </h:panelGroup>

        </h:panelGroup>

    </cc:implementation>

</html>
