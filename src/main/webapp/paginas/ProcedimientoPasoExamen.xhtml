<?xml version="1.0" encoding="UTF-8"?>

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="primefaces"
      xmlns:g="jakarta.faces.composite/galeno">

    <h:head>
        <title>#{msg['procedimientoPasoExamen.titulo']} - Galeno-SV</title>
    </h:head>

    <h:body>

        <g:layout>

            <f:facet name="workspace">

                <h:form id="frmProcedimientoPasoExamen">

                    <g:crud
                        titulo="#{msg['procedimientoPasoExamen.titulo']}"
                        modelo="#{procedimientoPasoExamenModel}"
                        rowKey="#{r.idProcedimientoPasoExamen}">

                        <p:column headerText="#{msg['campo.comun.codigo']}">
                            <h:outputText value="#{r.idProcedimientoPasoExamen}"/>
                        </p:column>

                        <p:column headerText="#{msg['campo.comun.fechaCreacion']}">
                            <h:outputText value="#{r.fechaCreacion}">
                                <f:convertDateTime pattern="dd/MM/yyyy"/>
                            </h:outputText>
                        </p:column>

                        <p:column headerText="#{msg['procedimientoPasoExamen.activo']}">
                            <h:outputText
                                value="#{r.activo ? msg['procedimientoPasoExamen.si'] : msg['procedimientoPasoExamen.no']}"/>
                        </p:column>

                        <p:column headerText="#{msg['campo.comun.observaciones']}">
                            <h:outputText value="#{r.observaciones}"/>
                        </p:column>

                        <p:column headerText="#{msg['procedimientoPasoExamen.examen']}">
                            <h:outputText value="#{r.idExamen.nombre}"/>
                        </p:column>

                        <p:column headerText="#{msg['procedimientoPasoExamen.procedimientoPaso']}">
                            <h:outputText value="#{r.idProcedimientoPaso.nombre}"/>
                        </p:column>

                        <f:facet name="formulario">

                            <p:panelGrid
                                columns="4"
                                layout="grid"
                                columnClasses="col-12 md:col-3 xl:col-2, col-12 md:col-9 xl:col-4, col-12 md:col-3 xl:col-2, col-12 md:col-9 xl:col-4"
                                contentStyleClass="align-items-baseline ui-fluid">

                                <p:outputLabel
                                    for="activo"
                                    value="#{msg['procedimientoPasoExamen.activo']}"/>

                                <p:selectBooleanCheckbox
                                    id="activo"
                                    value="#{procedimientoPasoExamenModel.registroActual.activo}"/>

                                <p:outputLabel
                                    for="observaciones"
                                    value="#{msg['campo.comun.observaciones']}"/>

                                <p:inputTextarea
                                    id="observaciones"
                                    value="#{procedimientoPasoExamenModel.registroActual.observaciones}"
                                    maxlength="2000"/>

                                <p:outputLabel
                                    for="examen"
                                    value="#{msg['procedimientoPasoExamen.examen']}"/>

                                <p:autoComplete
                                    id="examen"
                                    dropdown="true"
                                    value="#{procedimientoPasoExamenModel.registroActual.idExamen}"
                                    completeMethod="#{procedimientoPasoExamenModel.completarExamen}"
                                    converter="entityConverter"
                                    var="examen"
                                    itemLabel="#{examen.nombre}"
                                    itemValue="#{examen}"
                                    forceSelection="true"
                                    scrollHeight="250"
                                    minQueryLength="3"
                                    required="true"/>

                                <p:outputLabel
                                    for="procedimientoPaso"
                                    value="#{msg['procedimientoPasoExamen.procedimientoPaso']}"/>

                                <p:autoComplete
                                    id="procedimientoPaso"
                                    dropdown="true"
                                    value="#{procedimientoPasoExamenModel.registroActual.idProcedimientoPaso}"
                                    completeMethod="#{procedimientoPasoExamenModel.completarProcedimientoPaso}"
                                    converter="entityConverter"
                                    var="procedimientoPaso"
                                    itemLabel="#{procedimientoPaso.nombre}"
                                    itemValue="#{procedimientoPaso}"
                                    forceSelection="true"
                                    scrollHeight="250"
                                    minQueryLength="3"
                                    required="true"/>

                            </p:panelGrid>

                        </f:facet>

                    </g:crud>

                </h:form>

            </f:facet>

        </g:layout>

    </h:body>

</html>
