<?xml version="1.0" encoding="UTF-8"?>

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="primefaces"
      xmlns:g="jakarta.faces.composite/galeno">

    <h:head>
        <title>#{msg['tipoExamen.titulo']} - Galeno-SV</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    </h:head>

    <h:body>

        <g:layout>

            <f:facet name="workspace">

                <h:form id="frmTipoExamen">

                    <g:crud
                        titulo="#{msg['tipoExamen.titulo']}"
                        modelo="#{tipoExamenModel}"
                        rowKey="#{r.idTipoExamen}">

                        <!-- Columnas de la tabla (variable de fila: r) -->
                        <p:column headerText="#{msg['campo.comun.codigo']}">
                            <h:outputText value="#{r.idTipoExamen}"/>
                        </p:column>

                        <p:column headerText="#{msg['campo.comun.nombre']}">
                            <h:outputText value="#{r.nombre}"/>
                        </p:column>

                        <p:column headerText="#{msg['campo.comun.activo']}">
                            <h:outputText value="#{r.activo ? msg['campo.comun.activo'] : msg['campo.comun.inactivo']}"/>
                        </p:column>

                        <p:column headerText="#{msg['campo.comun.observaciones']}">
                            <h:outputText value="#{r.observaciones}"/>
                        </p:column>

                        <!-- Formulario de edicion -->
                        <f:facet name="formulario">

                            <p:panelGrid
                                columns="4"
                                layout="grid"
                                columnClasses="col-12 md:col-3 xl:col-2, col-12 md:col-9 xl:col-4, col-12 md:col-3 xl:col-2, col-12 md:col-9 xl:col-4"
                                contentStyleClass="align-items-baseline ui-fluid">

                                <p:outputLabel
                                    for="nombre"
                                    value="#{msg['campo.comun.nombre']}"/>

                                <p:inputText
                                    id="nombre"
                                    value="#{tipoExamenModel.registroActual.nombre}"/>

                                <p:outputLabel
                                    for="activo"
                                    value="#{msg['campo.comun.activo']}"/>

                                <p:toggleSwitch
                                    id="activo"
                                    value="#{tipoExamenModel.registroActual.activo}"/>

                                <p:outputLabel
                                    for="observaciones"
                                    value="#{msg['campo.comun.observaciones']}"/>

                                <p:inputTextarea
                                    id="observaciones"
                                    value="#{tipoExamenModel.registroActual.observaciones}"/>

                            </p:panelGrid>

                        </f:facet>

                    </g:crud>

                </h:form>

            </f:facet>

        </g:layout>

    </h:body>
    
</html>
