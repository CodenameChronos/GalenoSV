<?xml version="1.0" encoding="UTF-8"?>

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="primefaces"
      xmlns:g="jakarta.faces.composite/galeno">

    <h:head>
        <title>#{msg['tipoDocumento.titulo']} - Galeno-SV</title>
    </h:head>

    <h:body>

        <g:layout>

            <f:facet name="workspace">
                <h:form id="frmTipoDocumento">
                    <g:crud
                        titulo="#{msg['tipoDocumento.titulo']}"
                        modelo="#{tipoDocumentoModel}"
                        rowKey="#{r.idTipoDocumento}">

                        <!-- Columnas de la tabla -->
                        <p:column headerText="#{msg['campo.comun.codigo']}">
                            <h:outputText value="#{r.idTipoDocumento}"/>
                        </p:column>

                        <p:column headerText="#{msg['campo.comun.nombre']}">
                            <h:outputText value="#{r.nombre}"/>
                        </p:column>

                        <p:column headerText="#{msg['tipoDocumento.indicaciones']}">
                            <h:outputText value="#{r.indicaciones}"/>
                        </p:column>

                        <p:column headerText="#{msg['campo.comun.expresionRegular']}">
                            <h:outputText value="#{r.expresionRegular}"/>
                        </p:column>

                        <p:column headerText="#{msg['campo.comun.activo']}">
                            <h:outputText value="#{r.activo ? msg['campo.comun.activo'] : msg['campo.comun.inactivo']}"/>
                        </p:column>

                        <!-- Formulario de edición -->
                        <f:facet name="formulario">

                            <p:panelGrid
                                columns="4"
                                layout="grid"
                                columnClasses="col-12 md:col-3 xl:col-2, col-12 md:col-9 xl:col-4, col-12 md:col-3 xl:col-2, col-12 md:col-9 xl:col-4"
                                contentStyleClass="align-items-baseline ui-fluid">

                                <p:outputLabel
                                    for="nombre"
                                    value="#{msg['campo.comun.nombre']}"/>

                                <p:inputText
                                    id="nombre"
                                    value="#{tipoDocumentoModel.registroActual.nombre}"/>

                                <p:outputLabel
                                    for="activo"
                                    value="#{msg['campo.comun.activo']}"/>

                                <p:toggleSwitch
                                    id="activo"
                                    value="#{tipoDocumentoModel.registroActual.activo}"/>

                                <p:outputLabel
                                    for="indicaciones"
                                    value="#{msg['campo.comun.indicaciones']}"/>

                                <p:inputTextarea
                                    id="indicaciones"
                                    value="#{tipoDocumentoModel.registroActual.indicaciones}"/>

                                <p:outputLabel
                                    for="expresionRegular"
                                    value="#{msg['campo.comun.expresionRegular']}"/>

                                <p:inputText
                                    id="expresionRegular"
                                    value="#{tipoDocumentoModel.registroActual.expresionRegular}"/>

                            </p:panelGrid>

                        </f:facet>

                    </g:crud>
                    
                </h:form>

            </f:facet>

        </g:layout>

    </h:body>
    
</html>
