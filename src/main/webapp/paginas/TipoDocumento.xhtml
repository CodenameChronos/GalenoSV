<?xml version="1.0" encoding="UTF-8"?>

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="primefaces"
      xmlns:g="jakarta.faces.composite/galeno">

    <h:head>
        <title>Tipo Documento - Galeno-SV</title>
    </h:head>

    <h:body>

        <g:layout>

            <f:facet name="workspace">

                <g:crud
                    titulo="Tipo Documento"
                    modelo="#{tipoDocumentoModel}"
                    rowKey="#{r.idTipoDocumento}">

                    <!-- Columnas de la tabla -->
                    <p:column headerText="Codigo">
                        <h:outputText value="#{r.idTipoDocumento}"/>
                    </p:column>

                    <p:column headerText="Nombre">
                        <h:outputText value="#{r.nombre}"/>
                    </p:column>

                    <p:column headerText="Indicaciones">
                        <h:outputText value="#{r.indicaciones}"/>
                    </p:column>

                    <p:column headerText="Expresión Regular">
                        <h:outputText value="#{r.expresionRegular}"/>
                    </p:column>

                    <p:column headerText="Activo">
                        <h:outputText value="#{r.activo ? 'Activo' : 'Inactivo'}"/>
                    </p:column>

                    <!-- Formulario de edición -->
                    <f:facet name="formulario">

                        <p:panelGrid
                            columns="4"
                            layout="grid"
                            columnClasses="col-12 md:col-3 xl:col-2, col-12 md:col-9 xl:col-4, col-12 md:col-3 xl:col-2, col-12 md:col-9 xl:col-4"
                            contentStyleClass="align-items-baseline ui-fluid">

                            <p:outputLabel
                                for="nombre"
                                value="Nombre tipo documento"/>

                            <p:inputText
                                id="nombre"
                                value="#{tipoDocumentoModel.registroActual.nombre}"/>

                            <p:outputLabel
                                for="activo"
                                value="Activo"/>

                            <p:toggleSwitch
                                id="activo"
                                value="#{tipoDocumentoModel.registroActual.activo}"/>

                            <p:outputLabel
                                for="indicaciones"
                                value="Indicaciones"/>

                            <p:inputTextarea
                                id="indicaciones"
                                value="#{tipoDocumentoModel.registroActual.indicaciones}"/>

                            <p:outputLabel
                                for="expresionRegular"
                                value="Expresión regular"/>

                            <p:inputText
                                id="expresionRegular"
                                value="#{tipoDocumentoModel.registroActual.expresionRegular}"/>

                        </p:panelGrid>

                    </f:facet>

                </g:crud>

            </f:facet>

        </g:layout>

    </h:body>
</html>
