<?xml version="1.0" encoding="UTF-8"?>

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="primefaces"
      xmlns:g="jakarta.faces.composite/galeno">

<h:head>
    <title>#{msg['sesion.titulo']} - Galeno-SV</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
</h:head>

<h:body>
    <g:layout id="layout">
        <f:facet name="workspace">

            <h:form id="frmSesion">

                <p:messages showDetail="true" closable="true"/>

                <p:panel header="#{msg['sesion.titulo']}"
                         rendered="#{empty sesion.persona}">

                    <p:panelGrid
                            columns="1"
                            layout="grid"
                            columnClasses="col-12 md:col-3, col-12 md:col-9"
                            contentStyleClass="align-items-baseline ui-fluid">

                        <p:outputLabel
                                for="clinica"
                                value="#{msg['clinica.titulo']}"/>

                        <p:autoComplete
                                id="clinica"
                                dropdown="false"
                                value="#{sesionModel.clinica}"
                                completeMethod="#{sesionModel.completarClinica}"
                                converter="entityConverter"
                                var="cl"
                                itemLabel="#{cl.nombre}"
                                itemValue="#{cl}"
                                forceSelection="true"
                                scrollHeight="250"
                                minQueryLength="2"
                                emptyMessage="#{msg['sesion.sinClinicas']}"
                                required="true"
                                requiredMessage="#{msg['sesion.error.clinica']}">

                            <p:ajax event="itemSelect"
                                    listener="#{sesionModel.alCambiarClinica}"
                                    update="rol persona"/>
                            <p:ajax event="change"
                                    listener="#{sesionModel.alCambiarClinica}"
                                    update="rol persona"/>
                        </p:autoComplete>

                        <p:outputLabel
                                for="rol"
                                value="#{msg['rol.titulo']}"/>

                        <p:autoComplete
                                id="rol"
                                dropdown="false"
                                disabled="#{!sesionModel.rolHabilitado}"
                                value="#{sesionModel.rol}"
                                completeMethod="#{sesionModel.completarRol}"
                                converter="entityConverter"
                                var="rl"
                                itemLabel="#{rl.nombre}"
                                itemValue="#{rl}"
                                forceSelection="true"
                                scrollHeight="250"
                                minQueryLength="1"
                                emptyMessage="#{msg['sesion.sinRoles']}"
                                required="true"
                                requiredMessage="#{msg['sesion.error.rol']}">

                            <p:ajax event="itemSelect"
                                    listener="#{sesionModel.alCambiarRol}"
                                    update="persona"/>
                            <p:ajax event="change"
                                    listener="#{sesionModel.alCambiarRol}"
                                    update="persona"/>
                        </p:autoComplete>

                        <p:outputLabel
                                for="persona"
                                value="#{msg['persona.titulo']}"/>

                        <p:autoComplete
                                id="persona"
                                dropdown="false"
                                disabled="#{!sesionModel.personaHabilitada}"
                                value="#{sesionModel.sesionPersonaRol}"
                                completeMethod="#{sesionModel.completarPersonaRol}"
                                converter="entityConverter"
                                var="pr"
                                itemLabel="#{pr.idPersona.nombres} #{pr.idPersona.apellidos}"
                                itemValue="#{pr}"
                                forceSelection="true"
                                scrollHeight="250"
                                minQueryLength="1"
                                emptyMessage="#{msg['sesion.sin.personas']}"
                                required="true"
                                requiredMessage="#{msg['sesion.error.persona']}"/>

                    </p:panelGrid>

                    <p:separator/>

                    <p:commandButton
                            value="#{msg['sesion.iniciar']}"
                            action="#{sesionModel.establecerSesion}"
                            update="@form"
                            icon="pi pi-sign-in"/>

                </p:panel>

                <p:panel
                        header="#{msg['sesion.titulo']}"
                        rendered="#{not empty sesion.persona}">

                    <p:panelGrid
                            columns="2"
                            layout="grid"
                            columnClasses="col-12 md:col-3, col-12 md:col-9"
                            contentStyleClass="align-items-baseline ui-fluid">

                        <p:outputLabel value="#{msg['personaRol.persona']}"/>

                        <h:outputText
                                value="#{sesion.persona.nombres} #{sesion.persona.apellidos}"/>

                        <p:outputLabel value="#{msg['personaRol.rol']}"/>

                        <h:outputText
                                value="#{sesion.rol.nombre}"/>

                        <p:outputLabel value="#{msg['personaRol.clinica']}"/>

                        <h:outputText
                                value="#{sesion.clinica.nombre}"/>

                    </p:panelGrid>

                    <p:separator/>

                    <p:commandButton
                            value="#{msg['sesion.cerrar']}"
                            action="#{sesionModel.cerrarSesion}"
                            update="@form"
                            icon="pi pi-sign-out"/>

                </p:panel>

            </h:form>

        </f:facet>
    </g:layout>
</h:body>

</html>
