<?xml version="1.0" encoding="UTF-8"?>

<!DOCTYPE html>
<html  xmlns="http://www.w3.org/1999/xhtml"
       xmlns:h="jakarta.faces.html"
       xmlns:f="jakarta.faces.core"
       xmlns:p="primefaces"
       xmlns:g="jakarta.faces.composite/galeno">
    <h:head>
        <title>Clinica - Galeno SV</title>
    </h:head>
    <h:body>
        <g:layout>
            <f:facet name="workspace">
                <h:form id="frmClinica">
                    <g:crud 
                        titulo="Clinica"
                        modelo="#{clinicaModel}"
                        rowKey="#{r.idClinica}">

                        <p:column headerText="Código">
                            <h:outputText value="#{r.idClinica}"/>
                        </p:column>

                        <p:column headerText="Nombres">
                            <h:outputText value="#{r.nombre}"/>
                        </p:column>

                        <p:column headerText="Activo">
                            <h:outputText value="#{r.activo ? 'Activo' : 'Inactivo'}"/>
                        </p:column>

                        <p:column headerText="Tipo de clinica">
                            <h:outputText value="#{r.tipo}"/>
                        </p:column>

                        <p:column headerText="Comentarios">
                            <h:outputText value="#{r.comentarios}"/>
                        </p:column>

                        <f:facet name="formulario">
                            <p:panelGrid
                                columns="4"
                                layout="grid"
                                columnClasses="col-12 md:col-3 xl:col-2, col-12 md:col-9 xl:col-4, col-12 md:col-3 xl:col-2, col-12 md:col-9 xl:col-4"
                                contentStyleClass="align-items-baseline ui-fluid">

                                <p:outputLabel
                                    for="Nombres"
                                    value="Nombres"/>

                                <p:inputText
                                    id="Nombres"
                                    value="#{clinicaModel.registroActual.nombre}"/>

                                <p:outputLabel
                                    for="activo"
                                    value="Activo"/>

                                <p:toggleSwitch
                                    id="activo"
                                    value="#{clinicaModel.registroActual.activo}"/>

                                <p:outputLabel
                                    for="tipo"
                                    value="Tipo clinica"/>

                                <p:inputText
                                    id="tipo"
                                    value="#{clinicaModel.registroActual.tipo}"/>

                                <p:outputLabel
                                    for="comentarios"
                                    value="Comentarios"/>

                                <p:inputTextarea
                                    id="comentarios"
                                    value="#{clinicaModel.registroActual.comentarios}"/>


                            </p:panelGrid>
                        </f:facet>
                    </g:crud> 
                </h:form>
            </f:facet>
        </g:layout>
    </h:body>
</html>
