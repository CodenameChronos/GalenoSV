<?xml version="1.0" encoding="UTF-8"?>

<!DOCTYPE html>
<html  xmlns="http://www.w3.org/1999/xhtml"
       xmlns:h="jakarta.faces.html"
       xmlns:f="jakarta.faces.core"
       xmlns:p="primefaces"
       xmlns:g="jakarta.faces.composite/galeno">
    <h:head>
        <title>#{msg['clinica.titulo']} - Galeno-SV</title>
    </h:head>
    <h:body>
        <g:layout>
            <f:facet name="workspace">
                <h:form id="frmClinica">
                    <g:crud 
                        titulo="#{msg['clinica.titulo']}"
                        modelo="#{clinicaModel}"
                        rowKey="#{r.idClinica}">

                        <p:column headerText="#{msg['campo.comun.codigo']}">
                            <h:outputText value="#{r.idClinica}"/>
                        </p:column>

                        <p:column headerText="#{msg['campo.comun.nombre']}">
                            <h:outputText value="#{r.nombre}"/>
                        </p:column>

                        <p:column headerText="#{msg['campo.comun.activo']}">
                            <h:outputText value="#{r.activo ? msg['campo.comun.activo'] : msg['campo.comun.inactivo']}"/>
                        </p:column>

                        <p:column headerText="#{msg['clinica.tipoClinica']}">
                            <h:outputText value="#{r.tipo}"/>
                        </p:column>

                        <p:column headerText="#{msg['clinica.comentarios']}">
                            <h:outputText value="#{r.comentarios}"/>
                        </p:column>

                        <f:facet name="formulario">
                            <p:panelGrid
                                columns="4"
                                layout="grid"
                                columnClasses="col-12 md:col-3 xl:col-2, col-12 md:col-9 xl:col-4, col-12 md:col-3 xl:col-2, col-12 md:col-9 xl:col-4"
                                contentStyleClass="align-items-baseline ui-fluid">

                                <p:outputLabel
                                    for="Nombres"
                                    value="#{msg['campo.comun.nombre']}"/>

                                <p:inputText
                                    id="Nombres"
                                    value="#{clinicaModel.registroActual.nombre}"/>

                                <p:outputLabel
                                    for="activo"
                                    value="#{msg['campo.comun.activo']}"/>

                                <p:toggleSwitch
                                    id="activo"
                                    value="#{clinicaModel.registroActual.activo}"/>

                                <p:outputLabel
                                    for="tipo"
                                    value="#{msg['clinica.tipoClinica']}"/>

                                <p:inputText
                                    id="tipo"
                                    value="#{clinicaModel.registroActual.tipo}"/>

                                <p:outputLabel
                                    for="comentarios"
                                    value="#{msg['clinica.comentarios']}"/>

                                <p:inputTextarea
                                    id="comentarios"
                                    value="#{clinicaModel.registroActual.comentarios}"/>


                            </p:panelGrid>
                            
                        </f:facet>
                    </g:crud>
                    
                </h:form>
                
            </f:facet>
            
        </g:layout>
        
    </h:body>
    
</html>
