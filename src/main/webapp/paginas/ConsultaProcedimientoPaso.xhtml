<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="primefaces"
      xmlns:g="jakarta.faces.composite/galeno">
    <h:head>
        <title>#{msg['consultaProcedimientoPaso.titulo']} - Galeno-SV</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    </h:head>
    
    <h:body>
        
        <g:layout id="layout">
            
            <f:facet name="workspace">
                
                <h:form id="frmConsultaProcedimientoPaso">
                    
                    <g:crud
                        titulo="#{msg['consultaProcedimientoPaso.titulo']}"
                        modelo="#{consultaProcedimientoPasoModel}"
                        rowKey="#{r.idConsultaProcedimientoPaso}">
                        
                        <p:column headerText="#{msg['campo.comun.codigo']}">
                            <h:outputText value="#{r.idConsultaProcedimientoPaso}" />
                        </p:column>
                        
                        <p:column headerText="#{msg['campo.comun.fechaInicio']}">
                            <h:outputText value="#{r.fechaInicio}">
                                <f:convertDateTime pattern="dd/MM/yyyy"/>
                            </h:outputText>
                        </p:column>
                        
                        <p:column headerText="#{msg['campo.comun.fechaFin']}">
                            <h:outputText value="#{r.fechaFin}">
                                <f:convertDateTime pattern="dd/MM/yyyy"/>
                            </h:outputText>
                        </p:column>
                        
                        <p:column headerText="#{msg['campo.comun.activo']}">
                            <h:outputText value="#{r.estado ? msg['campo.comun.activo'] : msg['campo.comun.inactivo']}"/>
                        </p:column>
                        
                        <p:column headerText="#{msg['consultaProcedimiento.titulo']}">
                            <h:outputText value="#{consultaProcedimientoPasoModel.etiquetaConsultaProcedimiento(r.idConsultaProcedimiento)}" />
                        </p:column>
                        
                        <p:column headerText="#{msg['personaRol.titulo']}">
                            <h:outputText value="#{consultaProcedimientoPasoModel.etiquetaPersonaRol(r.idPersonaRol)}" />
                        </p:column>
                        
                        <f:facet name="formulario">
                            
                            <p:tabView id="tabsPaso" dynamic="false" styleClass="ui-fluid">
                                
                                <p:tab title="Datos generales">
                                    <p:panelGrid
                                        columns="4"
                                        layout="grid"
                                        columnClasses="col-12 md:col-3 xl:col-2, col-12 md:col-9 xl:col-4, col-12 md:col-3 xl:col-2, col-12 md:col-9 xl:col-4"
                                        contentStyleClass="align-items-baseline ui-fluid">

                                        <p:outputLabel for="fechaInicio" value="#{msg['campo.comun.fechaInicio']}" />
                                        <p:datePicker 
                                            id="fechaInicio" 
                                            value="#{consultaProcedimientoPasoModel.registroActual.fechaInicio}" showIcon="true" 
                                            buttonTabindex="0" pattern="dd/MM/yyyy" required="true" />

                                        <p:outputLabel for="estado" value="#{msg['campo.comun.activo']}"/>
                                        <p:toggleSwitch id="estado" value="#{consultaProcedimientoPasoModel.registroActual.estado}"/>

                                        <p:outputLabel for="fechaFin" value="#{msg['campo.comun.fechaFin']}" />
                                        <p:datePicker 
                                            id="fechaFin" 
                                            value="#{consultaProcedimientoPasoModel.registroActual.fechaFin}" showIcon="true" 
                                            buttonTabindex="0" pattern="dd/MM/yyyy"  />
                                    </p:panelGrid>
                                </p:tab>
                                
                                <p:tab title="#{msg['consultaProcedimiento.titulo']}">
                                    
                                    <p:outputPanel id="pnlConsultaProcedimiento">
                                        <h:inputHidden id="consultaProcedimiento"
                                                       value="#{consultaProcedimientoPasoModel.registroActual.idConsultaProcedimiento}"
                                                       converter="entityConverter"
                                                       required="true"
                                                       requiredMessage="Debe seleccionar un procedimiento de consulta"/>
                                        <p:message for="consultaProcedimiento"/>
                                        <div class="mb-3">
                                            <strong>Seleccionado: </strong>
                                            <h:outputText value="#{empty consultaProcedimientoPasoModel.registroActual.idConsultaProcedimiento ? 'Ninguno' : consultaProcedimientoPasoModel.etiquetaConsultaProcedimiento(consultaProcedimientoPasoModel.registroActual.idConsultaProcedimiento)}"/>
                                        </div>
                                    </p:outputPanel>
                                    
                                    <p:inputText id="filtroCP"
                                                 value="#{consultaProcedimientoPasoModel.filtroConsultaProcedimiento}"
                                                 placeholder="Filtrar por nombre del procedimiento (vacío = todos)"
                                                 styleClass="mb-3">
                                        <p:ajax event="keyup" delay="400"
                                                listener="#{consultaProcedimientoPasoModel.buscarConsultaProcedimiento}"
                                                update="tblCP"/>
                                    </p:inputText>
                                    
                                    <p:dataTable id="tblCP"
                                                 var="consp"
                                                 value="#{consultaProcedimientoPasoModel.resultadosConsultaProcedimiento}"
                                                 selectionMode="single"
                                                 selection="#{consultaProcedimientoPasoModel.registroActual.idConsultaProcedimiento}"
                                                 rowKey="#{consp.idConsultaProcedimiento}"
                                                 paginator="true" rows="8"
                                                 paginatorPosition="bottom"
                                                 emptyMessage="No se encontraron registros">
                                        <p:ajax event="rowSelect" update="pnlConsultaProcedimiento"/>
                                        <p:ajax event="rowUnselect" update="pnlConsultaProcedimiento"/>
                                        <p:column headerText="#{msg['procedimiento.titulo']}">
                                            <h:outputText value="#{consp.idProcedimiento.nombre}"/>
                                        </p:column>
                                        <p:column headerText="Paciente">
                                            <h:outputText value="#{consp.idConsulta.idPersonaRol.idPersona.nombreCompleto}"/>
                                        </p:column>
                                    </p:dataTable>
                                    
                                </p:tab>
                                
                                <p:tab title="#{msg['personaRol.titulo']}">
                                    
                                    <p:outputPanel id="pnlPersonaRol">
                                        <h:inputHidden id="personaRol"
                                                       value="#{consultaProcedimientoPasoModel.registroActual.idPersonaRol}"
                                                       converter="entityConverter"
                                                       required="true"
                                                       requiredMessage="Debe seleccionar una persona con rol"/>
                                        <p:message for="personaRol"/>
                                        <div class="mb-3">
                                            <strong>Seleccionado: </strong>
                                            <h:outputText value="#{empty consultaProcedimientoPasoModel.registroActual.idPersonaRol ? 'Ninguno' : consultaProcedimientoPasoModel.etiquetaPersonaRol(consultaProcedimientoPasoModel.registroActual.idPersonaRol)}"/>
                                        </div>
                                    </p:outputPanel>
                                    
                                    <p:inputText id="filtroPR"
                                                 value="#{consultaProcedimientoPasoModel.filtroPersonaRol}"
                                                 placeholder="Filtrar por nombres o apellidos (vacío = todos)"
                                                 styleClass="mb-3">
                                        <p:ajax event="keyup" delay="400"
                                                listener="#{consultaProcedimientoPasoModel.buscarPersonaRol}"
                                                update="tblPR"/>
                                    </p:inputText>
                                    
                                    <p:dataTable id="tblPR"
                                                 var="pr"
                                                 value="#{consultaProcedimientoPasoModel.resultadosPersonaRol}"
                                                 selectionMode="single"
                                                 selection="#{consultaProcedimientoPasoModel.registroActual.idPersonaRol}"
                                                 rowKey="#{pr.idPersonaRol}"
                                                 paginator="true" rows="8"
                                                 paginatorPosition="bottom"
                                                 emptyMessage="No se encontraron registros">
                                        <p:ajax event="rowSelect" update="pnlPersonaRol"/>
                                        <p:ajax event="rowUnselect" update="pnlPersonaRol"/>
                                        <p:column headerText="Persona">
                                            <h:outputText value="#{pr.idPersona.nombreCompleto}"/>
                                        </p:column>
                                        <p:column headerText="Rol">
                                            <h:outputText value="#{pr.idRol.nombre}"/>
                                        </p:column>
                                    </p:dataTable>
                                    
                                </p:tab>
                                
                            </p:tabView>
                            
                        </f:facet>
                        
                    </g:crud>
                    
                </h:form>
                
            </f:facet>
            
        </g:layout>
        
    </h:body>
    
</html>
