<?xml version="1.0" encoding="UTF-8"?>

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="primefaces"
      xmlns:g="jakarta.faces.composite/galeno">

    <h:head>
        <title>#{msg['rol.titulo']} - Galeno-SV</title>
    </h:head>

    <h:body>
        <g:layout>
            <f:facet name="workspace">
                <h:form id="frmRol">
                    <g:crud
                        titulo="#{msg['rol.titulo']}"
                        modelo="#{rolModel}"
                        rowKey="#{r.idRol}">

                        <p:column headerText="#{msg['campo.comun.codigo']}">
                            <h:outputText value="#{r.idRol}"/>
                        </p:column>

                        <p:column headerText="#{msg['campo.comun.nombre']}">
                            <h:outputText value="#{r.nombre}"/>
                        </p:column>

                        <p:column headerText="#{msg['campo.comun.activo']}">
                            <h:outputText value="#{r.activo ? msg['campo.comun.activo'] : msg['campo.comun.inactivo']}"/>
                        </p:column>

                        <p:column headerText="#{msg['campo.comun.observaciones']}">
                            <h:outputText value="#{r.observaciones}"/>
                        </p:column>

                        <f:facet name="formulario">
                            <p:panelGrid
                                columns="4"
                                layout="grid"
                                columnClasses="col-12 md:col-3 xl:col-2, col-12 md:col-9 xl:col-4, col-12 md:col-3 xl:col-2, col-12 md:col-9 xl:col-4"
                                contentStyleClass="align-items-baseline ui-fluid">

                                <p:outputLabel
                                    for="nombre"
                                    value="#{msg['campo.comun.nombre']}"/>

                                <p:inputText
                                    id="nombre"
                                    value="#{rolModel.registroActual.nombre}"/>

                                <p:outputLabel
                                    for="activo"
                                    value="#{msg['campo.comun.activo']}"/>

                                <p:toggleSwitch
                                    id="activo"
                                    value="#{rolModel.registroActual.activo}"/>

                                <p:outputLabel
                                    for="observaciones"
                                    value="#{msg['campo.comun.observaciones']}"/>

                                <p:inputTextarea
                                    id="observaciones"
                                    value="#{rolModel.registroActual.observaciones}"/>

                            </p:panelGrid>
                            
                        </f:facet>

                    </g:crud>
                    
                </h:form>
                
            </f:facet>
            
        </g:layout>
        
    </h:body>
    
</html>
