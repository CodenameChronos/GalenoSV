<?xml version="1.0" encoding="UTF-8"?>

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="primefaces"
      xmlns:g="jakarta.faces.composite/galeno">

    <h:head>
        <title>Rol - Galeno-SV</title>
    </h:head>

    <h:body>
        <g:layout>
            <f:facet name="workspace">
                <g:crud
                    titulo="Rol"
                    modelo="#{rolModel}"
                    rowKey="#{r.idRol}">

                    <p:column headerText="Codigo">
                        <h:outputText value="#{r.idRol}"/>
                    </p:column>

                    <p:column headerText="Nombre">
                        <h:outputText value="#{r.nombre}"/>
                    </p:column>

                    <p:column headerText="Activo">
                        <h:outputText value="#{r.activo ? 'Activo' : 'Inactivo'}"/>
                    </p:column>

                    <p:column headerText="Observaciones">
                        <h:outputText value="#{r.observaciones}"/>
                    </p:column>

                    <f:facet name="formulario">
                        <p:panelGrid
                            columns="4"
                            layout="grid"
                            columnClasses="col-12 md:col-3 xl:col-2, col-12 md:col-9 xl:col-4, col-12 md:col-3 xl:col-2, col-12 md:col-9 xl:col-4"
                            contentStyleClass="align-items-baseline ui-fluid">

                            <p:outputLabel
                                for="nombre"
                                value="Nombre"/>

                            <p:inputText
                                id="nombre"
                                value="#{rolModel.registroActual.nombre}"/>

                            <p:outputLabel
                                for="activo"
                                value="Activo"/>

                            <p:toggleSwitch
                                id="activo"
                                value="#{rolModel.registroActual.activo}"/>

                            <p:outputLabel
                                for="observaciones"
                                value="Observaciones"/>

                            <p:inputTextarea
                                id="observaciones"
                                value="#{rolModel.registroActual.observaciones}"/>

                        </p:panelGrid>
                    </f:facet>

                </g:crud>
            </f:facet>
        </g:layout>
    </h:body>
</html>
