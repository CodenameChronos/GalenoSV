<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="primefaces"
      xmlns:g="jakarta.faces.composite/galeno">
    <h:head>
        <title>#{msg['consultaProcedimiento.titulo']} - Galeno-SV</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    </h:head>
    
    <h:body>
        
        <g:layout id="layout">
            
            <f:facet name="workspace">
                
                <h:form id="frmConsultaProcedimiento">
                    
                    <g:crud
                        titulo="#{msg['consultaProcedimiento.titulo']}"
                        modelo="#{consultaProcedimientoModel}"
                        rowKey="#{r.idConsultaProcedimiento}">
                        
                        <p:column headerText="#{msg['campo.comun.codigo']}">
                            <h:outputText value="#{r.idConsultaProcedimiento}" />
                        </p:column>
                        
                        <p:column headerText="#{msg['procedimiento.titulo']}">
                            <h:outputText value="#{r.idProcedimiento.nombre}" />
                        </p:column>
                        
                        <p:column headerText="#{msg['campo.comun.fechaInicio']}">
                            <h:outputText value="#{r.fechaInicio}">
                                <f:convertDateTime pattern="dd/MM/yyyy"/>
                            </h:outputText>
                        </p:column>
                        
                        <p:column headerText="#{msg['campo.comun.fechaFin']}">
                            <h:outputText value="#{r.fechaFin}">
                                <f:convertDateTime pattern="dd/MM/yyyy"/>
                            </h:outputText>
                        </p:column>
                        
                        <p:column headerText="#{msg['campo.comun.observaciones']}">
                            <h:outputText value="#{r.observaciones}" />
                        </p:column>
                        
                        <p:column headerText="#{msg['consulta.titulo']}">
                            <h:outputText value="#{r.idConsulta.idPersonaRol.idPersona.nombreCompleto}" />
                        </p:column>
                        
                        <f:facet name="formulario">
                            
                            <p:tabView id="tabsConsultaProcedimiento" dynamic="false" styleClass="ui-fluid">
                                
                                <p:tab title="Datos generales">
                                    <p:panelGrid
                                        columns="4"
                                        layout="grid"
                                        columnClasses="col-12 md:col-3 xl:col-2, col-12 md:col-9 xl:col-4, col-12 md:col-3 xl:col-2, col-12 md:col-9 xl:col-4"
                                        contentStyleClass="align-items-baseline ui-fluid">

                                        <p:outputLabel for="fechaInicio" value="#{msg['campo.comun.fechaInicio']}" />
                                        <p:datePicker 
                                            id="fechaInicio" 
                                            value="#{consultaProcedimientoModel.registroActual.fechaInicio}" showIcon="true" 
                                            buttonTabindex="0" pattern="dd/MM/yyyy"  />

                                        <p:outputLabel for="fechaFin" value="#{msg['campo.comun.fechaFin']}" />
                                        <p:datePicker 
                                            id="fechaFin" 
                                            value="#{consultaProcedimientoModel.registroActual.fechaFin}" showIcon="true" 
                                            buttonTabindex="0" pattern="dd/MM/yyyy"  />

                                        <p:outputLabel for="observaciones" value="#{msg['campo.comun.observaciones']}" />
                                        <p:inputTextarea id="observaciones" value="#{consultaProcedimientoModel.registroActual.observaciones}" />
                                    </p:panelGrid>
                                </p:tab>
                                
                                <p:tab title="#{msg['procedimiento.titulo']}">
                                    
                                    <p:outputPanel id="pnlProcedimiento">
                                        <h:inputHidden id="procedimiento"
                                                       value="#{consultaProcedimientoModel.registroActual.idProcedimiento}"
                                                       converter="entityConverter"
                                                       required="true"
                                                       requiredMessage="Debe seleccionar un procedimiento"/>
                                        <p:message for="procedimiento"/>
                                        <div class="mb-3">
                                            <strong>Seleccionado: </strong>
                                            <h:outputText value="#{empty consultaProcedimientoModel.registroActual.idProcedimiento ? 'Ninguno' : consultaProcedimientoModel.registroActual.idProcedimiento.nombre}"/>
                                        </div>
                                    </p:outputPanel>
                                    
                                    <p:inputText id="filtroProc"
                                                 value="#{consultaProcedimientoModel.filtroProcedimiento}"
                                                 placeholder="Filtrar por nombre del procedimiento (vacío = todos)"
                                                 styleClass="mb-3">
                                        <p:ajax event="keyup" delay="400"
                                                listener="#{consultaProcedimientoModel.buscarProcedimiento}"
                                                update="tblProc"/>
                                    </p:inputText>
                                    
                                    <p:dataTable id="tblProc"
                                                 var="proc"
                                                 value="#{consultaProcedimientoModel.resultadosProcedimiento}"
                                                 selectionMode="single"
                                                 selection="#{consultaProcedimientoModel.registroActual.idProcedimiento}"
                                                 rowKey="#{proc.idProcedimiento}"
                                                 paginator="true" rows="8"
                                                 paginatorPosition="bottom"
                                                 emptyMessage="No se encontraron registros">
                                        <p:ajax event="rowSelect" update="pnlProcedimiento"/>
                                        <p:ajax event="rowUnselect" update="pnlProcedimiento"/>
                                        <p:column headerText="#{msg['procedimiento.titulo']}">
                                            <h:outputText value="#{proc.nombre}"/>
                                        </p:column>
                                    </p:dataTable>
                                    
                                </p:tab>
                                
                                <p:tab title="#{msg['consulta.titulo']}">
                                    
                                    <p:outputPanel id="pnlConsulta">
                                        <h:inputHidden id="consulta"
                                                       value="#{consultaProcedimientoModel.registroActual.idConsulta}"
                                                       converter="entityConverter"
                                                       required="true"
                                                       requiredMessage="Debe seleccionar una consulta"/>
                                        <p:message for="consulta"/>
                                        <div class="mb-3">
                                            <strong>Seleccionada: </strong>
                                            <h:outputText value="#{empty consultaProcedimientoModel.registroActual.idConsulta ? 'Ninguna' : consultaProcedimientoModel.etiquetaConsulta(consultaProcedimientoModel.registroActual.idConsulta)}"/>
                                        </div>
                                    </p:outputPanel>
                                    
                                    <p:inputText id="filtroCons"
                                                 value="#{consultaProcedimientoModel.filtroConsulta}"
                                                 placeholder="Filtrar por nombre o apellido del paciente (vacío = todos)"
                                                 styleClass="mb-3">
                                        <p:ajax event="keyup" delay="400"
                                                listener="#{consultaProcedimientoModel.buscarConsulta}"
                                                update="tblCons"/>
                                    </p:inputText>
                                    
                                    <p:dataTable id="tblCons"
                                                 var="c"
                                                 value="#{consultaProcedimientoModel.resultadosConsulta}"
                                                 selectionMode="single"
                                                 selection="#{consultaProcedimientoModel.registroActual.idConsulta}"
                                                 rowKey="#{c.idConsulta}"
                                                 paginator="true" rows="8"
                                                 paginatorPosition="bottom"
                                                 emptyMessage="No se encontraron registros">
                                        <p:ajax event="rowSelect" update="pnlConsulta"/>
                                        <p:ajax event="rowUnselect" update="pnlConsulta"/>
                                        <p:column headerText="Paciente">
                                            <h:outputText value="#{c.idPersonaRol.idPersona.nombreCompleto}"/>
                                        </p:column>
                                        <p:column headerText="#{msg['campo.comun.fechaInicio']}">
                                            <h:outputText value="#{c.fechaInicio}">
                                                <f:convertDateTime pattern="dd/MM/yyyy"/>
                                            </h:outputText>
                                        </p:column>
                                    </p:dataTable>
                                    
                                </p:tab>
                                
                            </p:tabView>
                            
                        </f:facet>
                        
                    </g:crud>
                    
                </h:form>
                
            </f:facet>
            
        </g:layout>
        
    </h:body>
    
</html>
