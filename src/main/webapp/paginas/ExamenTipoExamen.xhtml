<?xml version="1.0" encoding="UTF-8"?>

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="primefaces"
      xmlns:g="jakarta.faces.composite/galeno">

    <h:head>

        <title>
            #{msg['examenTipoExamen.titulo']} - Galeno-SV
        </title>

        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"/>

    </h:head>

    <h:body>

        <g:layout>

            <f:facet name="workspace">

                <h:form id="frmExamenTipoExamen">

                    <g:crud
                        titulo="#{msg['examenTipoExamen.titulo']}"
                        modelo="#{examenTipoExamenModel}"
                        rowKey="#{r.idExamen}">

                        <!-- TABLA PRINCIPAL -->

                        <p:column
                            headerText="#{msg['campo.comun.codigo']}">

                            <h:outputText
                                value="#{r.idExamen}"/>

                        </p:column>

                        <p:column
                            headerText="#{msg['campo.comun.nombre']}">

                            <h:outputText
                                value="#{r.nombre}"/>

                        </p:column>

                        <p:column
                            headerText="#{msg['campo.comun.activo']}">

                            <h:outputText
                                value="#{r.activo ? msg['campo.comun.activo'] : msg['campo.comun.inactivo']}"/>

                        </p:column>

                        <p:column
                            headerText="#{msg['campo.comun.observaciones']}">

                            <h:outputText
                                value="#{r.observaciones}"/>

                        </p:column>


                        <!-- FORMULARIO -->

                        <f:facet name="formulario">

                            <p:tabView id="tabsExamenTipoExamen">

                                <p:ajax
                                    event="tabChange"
                                    listener="#{examenTipoExamenArbolModel.alEntrarPestana}"
                                    process="@this"
                                    update="pnlTiposExamen"/>


                                <!-- DATOS DEL EXAMEN -->

                                <p:tab
                                    title="#{msg['examen.titulo']}">

                                    <p:panelGrid
                                        columns="2"
                                        layout="grid"
                                        columnClasses="col-12 md:col-3 xl:col-2, col-12 md:col-9 xl:col-4"
                                        contentStyleClass="align-items-baseline ui-fluid">

                                        <p:outputLabel
                                            for="nombre"
                                            value="#{msg['campo.comun.nombre']}"/>

                                        <p:inputText
                                            id="nombre"
                                            value="#{examenTipoExamenModel.registroActual.nombre}"
                                            required="true"/>


                                        <p:outputLabel
                                            for="activo"
                                            value="#{msg['campo.comun.activo']}"/>

                                        <p:toggleSwitch
                                            id="activo"
                                            value="#{examenTipoExamenModel.registroActual.activo}"/>


                                        <p:outputLabel
                                            for="observaciones"
                                            value="#{msg['campo.comun.observaciones']}"/>

                                        <p:inputTextarea
                                            id="observaciones"
                                            value="#{examenTipoExamenModel.registroActual.observaciones}"/>

                                    </p:panelGrid>

                                </p:tab>


                                <!-- TIPOS DE EXAMEN -->

                                <p:tab
                                    title="#{msg['tipoExamen.titulo']}"
                                    disabled="#{examenTipoExamenModel.estado == 'CREAR'}">

                                    <h:panelGroup
                                        id="pnlTiposExamen"
                                        layout="block">

                                        <p:fieldset
                                            legend="#{msg['tipoExamen.titulo']}">

                                            <div class="flex align-items-center flex-wrap gap-2 mb-3">

                                                <p:autoComplete
                                                    id="tipoExamenAgregar"
                                                    value="#{examenTipoExamenArbolModel.tipoExamenAgregar}"
                                                    completeMethod="#{examenTipoExamenArbolModel.completarTipoExamen}"
                                                    var="tipo"
                                                    itemLabel="#{tipo.nombre}"
                                                    itemValue="#{tipo}"
                                                    converter="entityConverter"
                                                    forceSelection="true"
                                                    minQueryLength="1"
                                                    placeholder="#{msg['tipoExamen.titulo']}"/>


                                                <p:commandButton
                                                    value="#{msg['procedimiento.examenes.agregar']}"
                                                    actionListener="#{examenTipoExamenArbolModel.agregarTipoExamen}"
                                                    process="@this @([id$=pnlTiposExamen])"
                                                    update="@([id$=pnlTiposExamen])"/>


                                                <p:commandButton
                                                    value="#{msg['procedimiento.examenes.quitar']}"
                                                    actionListener="#{examenTipoExamenArbolModel.quitarTipoExamen}"
                                                    process="@this @([id$=pnlTiposExamen])"
                                                    update="@([id$=pnlTiposExamen])"/>

                                            </div>


                                            <p:dataTable
                                                id="tblTiposExamen"
                                                value="#{examenTipoExamenArbolModel.tiposExamenForm}"
                                                var="tipo"
                                                rowKey="#{tipo.idTipoExamen}"
                                                selection="#{examenTipoExamenArbolModel.tipoExamenSeleccionado}"
                                                emptyMessage="No hay tipos de examen agregados.">

                                                <p:column
                                                    selectionMode="single"
                                                    style="width:3rem;text-align:center"/>

                                                <p:column
                                                    headerText="#{msg['campo.comun.nombre']}">

                                                    <h:outputText
                                                        value="#{tipo.nombre}"/>

                                                </p:column>

                                            </p:dataTable>

                                        </p:fieldset>

                                    </h:panelGroup>

                                </p:tab>

                            </p:tabView>

                        </f:facet>

                    </g:crud>

                </h:form>

            </f:facet>

        </g:layout>

    </h:body>

</html>
