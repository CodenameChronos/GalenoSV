<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
    <h:head>
        <title>Facelet Title</title>
    </h:head>
    <h:body>
        <style>
            table {
                border: solid black;
            }
            td {
                border: solid red;
            }
        </style>
        <h:form>
            <h:dataTable value="#{tipoExamenModel.registros}" var="r">
                <h:column>
                    <h:outputText value = "#{r.idTipoExamen}"/>
                    <f:facet name = "header">
                        ID
                    </f:facet>
                </h:column>
                <h:column>
                    <h:outputText value ="#{r.nombre}"/>
                </h:column>
            </h:dataTable>
            <h:commandButton value="Nuevo" actionListener="#{tipoExamenModel.btnNuevoHandler}"/>
        </h:form>
        <h:messages globalOnly="false" showDetail="true"/>
        <h:panelGroup>
            <h:form>
                <h:panelGrid columns="2">
                    <h:outputLabel value="ID" for="txtId" />
                    <h:inputText id="txtId" size="70" value="#{TipoExamen.registro.idTipoExamen}"/>
                </h:panelGrid>
            </h:form>
        </h:panelGroup>
    </h:body>
</html>
